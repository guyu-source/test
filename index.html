<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>站点占位页</title>
  <meta name="description" content="该站点首页不提供项目导航入口" />
  <meta name="robots" content="noindex,nofollow" />
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .panel {
      width: min(560px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1.1rem 1rem;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.06);
      text-align: center;
    }
    h1 {
      margin: 0 0 0.45rem;
      font-size: 1.2rem;
      font-weight: 700;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.55;
    }
  </style>
</head>
<body>
  <main class="panel" aria-label="占位说明">
    <h1>站点首页</h1>
    <p>该页面不提供项目导航入口。</p>
  </main>
</body>
</html>
