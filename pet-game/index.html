<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>学习电子宠物</title>
  <meta name="description" content="课堂激励小游戏：照顾电子宠物，完成学习获得奖励。" />
  <style>
    :root {
      --bg: #f6f4ea;
      --card: #ffffff;
      --accent: #2d8a6e;
      --accent2: #ffc857;
      --text: #243037;
      --muted: #64707a;
      --danger: #d9534f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at top, #fcfff8 0%, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 1rem;
    }
    .app {
      width: min(920px, 100%);
      display: grid;
      gap: 1rem;
      grid-template-columns: 1.15fr 1fr;
    }
    .panel {
      background: var(--card);
      border-radius: 16px;
      padding: 1rem;
      border: 1px solid #dbe8e1;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.06);
    }
    h1 {
      margin: 0 0 0.35rem;
      color: var(--accent);
      font-size: 1.35rem;
    }
    .sub {
      margin: 0 0 1rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .pet-box {
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #f7fff8 0%, #ecf7ee 100%);
      border: 2px dashed #a8d4bc;
      border-radius: 14px;
      min-height: 250px;
      text-align: center;
      padding: 1rem;
    }
    .pet {
      font-size: 4.1rem;
      line-height: 1;
      margin-bottom: 0.45rem;
    }
    .name {
      font-size: 1.1rem;
      font-weight: 700;
    }
    .mood {
      margin-top: 0.25rem;
      color: #355444;
      font-size: 0.92rem;
    }
    .stats {
      margin-top: 0.8rem;
      display: grid;
      gap: 0.5rem;
    }
    .row {
      display: grid;
      grid-template-columns: 4.8rem 1fr 2.5rem;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
    }
    .bar {
      height: 10px;
      background: #ebf1ee;
      border-radius: 999px;
      overflow: hidden;
    }
    .fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #84c9a7, #2d8a6e);
      transition: width 200ms ease;
    }
    .actions {
      margin-top: 0.9rem;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.55rem;
    }
    button {
      border: none;
      border-radius: 999px;
      padding: 0.62rem 0.78rem;
      font: inherit;
      cursor: pointer;
      font-weight: 700;
      background: #e7f3ec;
      color: #1f5e47;
      transition: transform 120ms ease, filter 120ms ease;
    }
    button:hover { filter: brightness(1.03); }
    button:active { transform: scale(0.98); }
    .btn-main {
      background: var(--accent);
      color: #fff;
    }
    .btn-learn {
      background: var(--accent2);
      color: #4d3b0a;
    }
    .score {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin-bottom: 0.9rem;
    }
    .score .card {
      background: #f8fbf9;
      border: 1px solid #e0ece5;
      border-radius: 12px;
      padding: 0.6rem;
      text-align: center;
    }
    .linkage-box {
      margin-bottom: 0.8rem;
      padding: 0.72rem;
      border-radius: 12px;
      border: 1px dashed #b8d6c8;
      background: #f4faf7;
    }
    .linkage-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: #255f49;
      margin-bottom: 0.25rem;
    }
    .linkage-text {
      font-size: 0.82rem;
      color: #4d6257;
      line-height: 1.5;
      margin-bottom: 0.45rem;
    }
    .btn-claim {
      width: 100%;
      background: #2d8a6e;
      color: #fff;
    }
    .label {
      font-size: 0.76rem;
      color: var(--muted);
      margin-bottom: 0.2rem;
    }
    .num {
      font-size: 1.2rem;
      font-weight: 800;
      color: #205743;
    }
    .log {
      border: 1px solid #e3ece8;
      border-radius: 12px;
      background: #fbfdfc;
      padding: 0.65rem;
      height: 340px;
      overflow: auto;
      font-size: 0.86rem;
      line-height: 1.5;
      color: #32444f;
    }
    .warn { color: var(--danger); font-weight: 700; }
    .ok { color: #1f7a56; font-weight: 700; }
    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      .log { height: 240px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="panel">
      <h1>学习电子宠物</h1>
      <p class="sub">独立项目：和拼音转盘互不影响。保持宠物健康，完成学习拿奖励。</p>
      <div class="pet-box">
        <div class="pet" id="petFace">🐣</div>
        <div class="name">宠物：<span id="petName">小芽</span></div>
        <div class="mood" id="petMood">状态：刚睡醒，元气满满</div>
      </div>
      <div class="stats">
        <div class="row">
          <span>饱食度</span>
          <div class="bar"><div class="fill" id="barHunger"></div></div>
          <span id="valHunger">80</span>
        </div>
        <div class="row">
          <span>快乐值</span>
          <div class="bar"><div class="fill" id="barHappy"></div></div>
          <span id="valHappy">80</span>
        </div>
        <div class="row">
          <span>体力值</span>
          <div class="bar"><div class="fill" id="barEnergy"></div></div>
          <span id="valEnergy">80</span>
        </div>
        <div class="row">
          <span>整洁度</span>
          <div class="bar"><div class="fill" id="barClean"></div></div>
          <span id="valClean">80</span>
        </div>
      </div>
      <div class="actions">
        <button class="btn-main" id="btnFeed">喂食 +18</button>
        <button class="btn-main" id="btnPlay">玩耍 +16</button>
        <button id="btnRest">休息 +20</button>
        <button id="btnClean">清洁 +20</button>
        <button class="btn-learn" id="btnLearn">完成学习 +1⭐</button>
        <button id="btnRename">改名</button>
      </div>
    </section>

    <section class="panel">
      <div class="score">
        <div class="card">
          <div class="label">等级</div>
          <div class="num" id="levelNum">1</div>
        </div>
        <div class="card">
          <div class="label">经验</div>
          <div class="num" id="expNum">0 / 5</div>
        </div>
        <div class="card">
          <div class="label">星星</div>
          <div class="num" id="starNum">0</div>
        </div>
      </div>
      <div class="linkage-box">
        <div class="linkage-title">课堂联动奖励</div>
        <div class="linkage-text" id="linkageText">拼音练习累计 0 次，可领奖励 0 次。</div>
        <button class="btn-claim" id="btnClaimLinkage">领取课堂奖励</button>
      </div>
      <div class="log" id="log"></div>
    </section>
  </main>

  <script>
    (function () {
      var state = {
        name: "小芽",
        hunger: 80,
        happy: 80,
        energy: 80,
        clean: 80,
        stars: 0,
        level: 1,
        exp: 0,
        expNeed: 5
      };

      var el = {
        petFace: document.getElementById("petFace"),
        petName: document.getElementById("petName"),
        petMood: document.getElementById("petMood"),
        barHunger: document.getElementById("barHunger"),
        barHappy: document.getElementById("barHappy"),
        barEnergy: document.getElementById("barEnergy"),
        barClean: document.getElementById("barClean"),
        valHunger: document.getElementById("valHunger"),
        valHappy: document.getElementById("valHappy"),
        valEnergy: document.getElementById("valEnergy"),
        valClean: document.getElementById("valClean"),
        levelNum: document.getElementById("levelNum"),
        expNum: document.getElementById("expNum"),
        starNum: document.getElementById("starNum"),
        linkageText: document.getElementById("linkageText"),
        btnClaimLinkage: document.getElementById("btnClaimLinkage"),
        log: document.getElementById("log"),
        btnFeed: document.getElementById("btnFeed"),
        btnPlay: document.getElementById("btnPlay"),
        btnRest: document.getElementById("btnRest"),
        btnClean: document.getElementById("btnClean"),
        btnLearn: document.getElementById("btnLearn"),
        btnRename: document.getElementById("btnRename")
      };

      var LS_PRACTICE_COUNT_KEY = "classroom_pinyin_practice_count";
      var LS_CLAIMED_BLOCKS_KEY = "classroom_pinyin_claimed_blocks";

      function clamp(v) {
        return Math.max(0, Math.min(100, Math.round(v)));
      }

      function avgStatus() {
        return (state.hunger + state.happy + state.energy + state.clean) / 4;
      }

      function moodText() {
        var avg = avgStatus();
        if (avg >= 80) return { face: "😄", text: "状态：超开心，学习劲头很足", cls: "ok" };
        if (avg >= 60) return { face: "🙂", text: "状态：不错，继续保持", cls: "ok" };
        if (avg >= 40) return { face: "😐", text: "状态：有点累了，需要照顾", cls: "" };
        if (avg >= 20) return { face: "😣", text: "状态：不太舒服，快照顾我", cls: "warn" };
        return { face: "😭", text: "状态：快没精神了，马上行动", cls: "warn" };
      }

      function log(msg, type) {
        var row = document.createElement("div");
        if (type) row.className = type;
        row.textContent = "• " + msg;
        el.log.prepend(row);
      }

      function render() {
        el.petName.textContent = state.name;
        el.barHunger.style.width = state.hunger + "%";
        el.barHappy.style.width = state.happy + "%";
        el.barEnergy.style.width = state.energy + "%";
        el.barClean.style.width = state.clean + "%";
        el.valHunger.textContent = state.hunger;
        el.valHappy.textContent = state.happy;
        el.valEnergy.textContent = state.energy;
        el.valClean.textContent = state.clean;
        el.levelNum.textContent = state.level;
        el.expNum.textContent = state.exp + " / " + state.expNeed;
        el.starNum.textContent = state.stars;
        var m = moodText();
        el.petFace.textContent = m.face;
        el.petMood.textContent = m.text;
        el.petMood.className = "mood" + (m.cls ? " " + m.cls : "");
        renderLinkage();
      }

      function gainExp(v) {
        state.exp += v;
        while (state.exp >= state.expNeed) {
          state.exp -= state.expNeed;
          state.level += 1;
          state.expNeed += 2;
          state.hunger = clamp(state.hunger + 10);
          state.happy = clamp(state.happy + 10);
          state.energy = clamp(state.energy + 10);
          state.clean = clamp(state.clean + 10);
          log("升级啦！达到 Lv." + state.level + "，全属性小幅恢复。", "ok");
        }
      }

      function getStorageNum(key) {
        try {
          var n = Number(localStorage.getItem(key) || 0);
          return Number.isFinite(n) && n > 0 ? Math.floor(n) : 0;
        } catch (e) {
          return 0;
        }
      }

      function setStorageNum(key, n) {
        try {
          localStorage.setItem(key, String(Math.max(0, Math.floor(n))));
        } catch (e) {
          /* ignore storage errors */
        }
      }

      function linkageProgress() {
        var practice = getStorageNum(LS_PRACTICE_COUNT_KEY);
        var claimedBlocks = getStorageNum(LS_CLAIMED_BLOCKS_KEY);
        var totalBlocks = Math.floor(practice / 5);
        var canClaimBlocks = Math.max(0, totalBlocks - claimedBlocks);
        return {
          practice: practice,
          claimedBlocks: claimedBlocks,
          canClaimBlocks: canClaimBlocks
        };
      }

      function renderLinkage() {
        if (!el.linkageText || !el.btnClaimLinkage) return;
        var p = linkageProgress();
        el.linkageText.textContent =
          "拼音练习累计 " + p.practice + " 次，可领奖励 " + p.canClaimBlocks + " 次。每次奖励：+2⭐ 与 +3经验。";
        el.btnClaimLinkage.disabled = p.canClaimBlocks <= 0;
      }

      function claimLinkageReward() {
        var p = linkageProgress();
        if (p.canClaimBlocks <= 0) {
          log("暂无可领取课堂奖励，先去做拼音练习。");
          return;
        }
        var starsGain = p.canClaimBlocks * 2;
        var expGain = p.canClaimBlocks * 3;
        state.stars += starsGain;
        gainExp(expGain);
        setStorageNum(LS_CLAIMED_BLOCKS_KEY, p.claimedBlocks + p.canClaimBlocks);
        render();
        log("领取课堂联动奖励：" + starsGain + "⭐，经验 +" + expGain + "。", "ok");
      }

      function tickDown() {
        state.hunger = clamp(state.hunger - (1 + Math.random() * 2));
        state.happy = clamp(state.happy - (1 + Math.random() * 2));
        state.energy = clamp(state.energy - (1 + Math.random() * 2));
        state.clean = clamp(state.clean - (1 + Math.random() * 2));
        render();

        if (state.hunger <= 15 || state.happy <= 15 || state.energy <= 15 || state.clean <= 15) {
          log("宠物状态偏低，记得及时喂食/休息/清洁。", "warn");
        }
      }

      el.btnFeed.addEventListener("click", function () {
        state.hunger = clamp(state.hunger + 18);
        state.clean = clamp(state.clean - 4);
        gainExp(1);
        render();
        log("喂食完成，饱食度提升。");
      });

      el.btnPlay.addEventListener("click", function () {
        state.happy = clamp(state.happy + 16);
        state.energy = clamp(state.energy - 6);
        gainExp(1);
        render();
        log("玩耍成功，快乐值上升。");
      });

      el.btnRest.addEventListener("click", function () {
        state.energy = clamp(state.energy + 20);
        state.hunger = clamp(state.hunger - 5);
        gainExp(1);
        render();
        log("休息完成，体力恢复。");
      });

      el.btnClean.addEventListener("click", function () {
        state.clean = clamp(state.clean + 20);
        gainExp(1);
        render();
        log("清洁完成，宠物更舒服了。");
      });

      el.btnLearn.addEventListener("click", function () {
        state.stars += 1;
        state.happy = clamp(state.happy + 8);
        state.energy = clamp(state.energy + 6);
        gainExp(2);
        render();
        log("学习打卡成功，获得 1 颗星星！", "ok");
      });

      el.btnRename.addEventListener("click", function () {
        var name = prompt("给宠物起个名字：", state.name);
        if (!name) return;
        state.name = String(name).trim().slice(0, 12) || state.name;
        render();
        log("宠物改名为「" + state.name + "」。");
      });

      el.btnClaimLinkage.addEventListener("click", claimLinkageReward);

      render();
      log("欢迎来到学习电子宠物，先完成一次学习打卡吧。", "ok");
      setInterval(tickDown, 4500);
    })();
  </script>
</body>
</html>
