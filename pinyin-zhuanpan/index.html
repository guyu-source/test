  <style>
    :root {

    .section-spin .wheel-box {

    .wheels {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      justify-content: center;
      align-items: flex-start;
      max-width: 720px;
    }

    .wheel-wrap {
      background: var(--card);
      border-radius: 16px;
      padding: 1rem 1.25rem 1.25rem;
      box-shadow: 0 4px 20px var(--shadow);
      text-align: center;
    }

    .wheel-wrap h2 {
      margin: 0 0 0.75rem;

    .wheel-box {
      position: relative;
      width: min(280px, 85vw);
      height: min(280px, 85vw);
      margin: 0 auto;
    }

    .wheel-box::before {
      content: "";
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;

      box-shadow: inset 0 0 0 2px #e0ddd4, 0 6px 24px var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .wheel svg {
      display: block;
      width: 100%;
      height: 100%;

    .center-cap {

      top: 50%;
      left: 50%;
      width: 22%;
      height: 22%;

    @media (max-width: 880px) {

<body>
  <h1>声韵母转盘练习</h1>
  <p class="subtitle">手机打开即可先练习；向下滑为课本《汉语拼音字母表》对照。电脑宽屏为左挂图、右转盘。</p>

  <div class="main-layout">
    <div class="section-spin">
      <p class="spin-title">转盘练习</p>
      <div class="wheels">
        <div class="wheel-wrap">
          <h2>声母表 <span class="wheel-meta">（23 个）</span></h2>
          <div class="wheel-box">
            <div class="wheel" id="wheelSheng" aria-hidden="true"></div>
            <div class="center-cap" aria-hidden="true"></div>
          </div>
        </div>
        <div class="wheel-wrap">
          <h2>韵母表 <span class="wheel-meta">（24 个）</span></h2>
          <div class="wheel-box">
            <div class="wheel" id="wheelYun" aria-hidden="true"></div>
            <div class="center-cap" aria-hidden="true"></div>
          </div>
        </div>
      </div>

      <div class="result">
        <div class="result-label">本次结果</div>
        <div class="result-pair" id="resultText">
          <span id="outSheng">—</span>
          <span id="outYun">—</span>
        </div>
      </div>

      <div class="btn-row">
        <button type="button" class="btn-spin" id="btnSpin">转一次</button>
      </div>
    </div>

    <div class="chart-sheet" aria-label="汉语拼音字母表挂图">
      <p class="chart-eyebrow">课本字母表 · 对照用（家长可下滑查看）</p>
      <div class="chart-box">
        <h3>声母表（23个）</h3>
        <div id="wallSheng"></div>
      </div>
      <div class="chart-box">
        <h3>韵母表（24个）</h3>
        <div id="wallYun"></div>
      </div>
      <div class="chart-box" aria-labelledby="ztitle">
        <h3 id="ztitle">整体认读音节（16个）</h3>
        <p class="note">整读不学拼，与「声母 + 韵母」拼读分开掌握。</p>
        <div class="zhengtilist" id="zhengtilist"></div>
      </div>
    </div>
  </div>

  <p class="hint">指针在转盘正上方。韵母转盘顺序与下方挂图一致：单韵母 → 复韵母 → 前鼻韵母 → 后鼻韵母。</p>

  <script>
    (function () {
      var SHENGMU = [
        "b", "p", "m", "f", "d", "t", "n", "l", "g", "k",
        "h", "j", "q", "x", "zh", "ch", "sh", "r", "z", "c",
        "s", "y", "w"
      ];

      var YUNMU = [
        "a", "o", "e", "i", "u", "ü",
        "ai", "ei", "ui", "ao", "ou", "iu", "ie", "üe", "er",
        "an", "en", "in", "un", "ün",
        "ang", "eng", "ing", "ong"
      ];

      var ZHENGTI = [
        "zhi", "chi", "shi", "ri", "zi", "ci", "si",
        "yi", "wu", "yu", "ye", "yue", "yuan",
        "yin", "yun", "ying"
      ];

      var colorsSheng = [
        "#7eb8da", "#a8d4e6", "#c5e8f0", "#9fd4c1", "#b8e0c8",
        "#d4e8b8", "#e8e2a8", "#f0d4a0", "#e8c4a0", "#dcb8a8",
        "#c8b8d8", "#b8a8d8", "#a898d0", "#98a8c8", "#8898c0",
        "#a0b8d0", "#b0c8d8", "#c0d8e0", "#d0e8e8", "#a8d0c8",
        "#90c8b8", "#88c0b0", "#80b8a8"
      ];

      var colorsYun = [].concat(
        ["#c8e6c9", "#aed581", "#9ccc65", "#8bc34a", "#7cb342", "#689f38"],
        ["#ffe0b2", "#ffcc80", "#ffb74d", "#ffa726", "#ff9800", "#fb8c00", "#f57c00", "#ef6c00", "#fff3e0"],
        ["#b3e5fc", "#81d4fa", "#4fc3f7", "#29b6f6", "#039be5"],
        ["#e1bee7", "#ce93d8", "#ba68c8", "#ab47bc"]
      );

      function appendCellsRow(container, slice) {
        var row = document.createElement("div");
        row.className = "chart-cell-row";
        for (var i = 0; i < slice.length; i++) {
          var cell = document.createElement("span");
          cell.className = "pinyin-cell";
          cell.textContent = slice[i];
          row.appendChild(cell);
        }
        container.appendChild(row);
      }

      var wallSheng = document.getElementById("wallSheng");
      if (wallSheng) {
        appendCellsRow(wallSheng, SHENGMU.slice(0, 10));
        appendCellsRow(wallSheng, SHENGMU.slice(10, 20));
        appendCellsRow(wallSheng, SHENGMU.slice(20, 23));
      }

      var wallYun = document.getElementById("wallYun");
      if (wallYun) {
        var yunGroups = [
          { label: "单韵母\n（6个）", slice: YUNMU.slice(0, 6) },
          { label: "复韵母\n（9个）", slice: YUNMU.slice(6, 15) },
          { label: "前鼻韵母\n（5个）", slice: YUNMU.slice(15, 20) },
          { label: "后鼻韵母\n（4个）", slice: YUNMU.slice(20, 24) }
        ];
        for (var g = 0; g < yunGroups.length; g++) {
          var wrap = document.createElement("div");
          wrap.className = "yun-row";
          var lab = document.createElement("div");
          lab.className = "yun-label";
          lab.textContent = yunGroups[g].label;
          var cells = document.createElement("div");
          appendCellsRow(cells, yunGroups[g].slice);
          wrap.appendChild(lab);
          wrap.appendChild(cells);
          wallYun.appendChild(wrap);
        }
      }

      var zl = document.getElementById("zhengtilist");
      if (zl) {
        appendCellsRow(zl, ZHENGTI.slice(0, 7));
        appendCellsRow(zl, ZHENGTI.slice(7, 13));
        appendCellsRow(zl, ZHENGTI.slice(13, 16));
      }

      function buildWheel(el, items, colors) {
        var n = items.length;
        var slice = 360 / n;
        var svgNS = "http://www.w3.org/2000/svg";
        var svg = document.createElementNS(svgNS, "svg");
        svg.setAttribute("viewBox", "-1 -1 2 2");
        for (var i = 0; i < n; i++) {
          var start = (i * slice - 90) * (Math.PI / 180);
          var end = ((i + 1) * slice - 90) * (Math.PI / 180);
          var x1 = Math.cos(start);
          var y1 = Math.sin(start);
          var x2 = Math.cos(end);
          var y2 = Math.sin(end);
          var large = slice > 180 ? 1 : 0;
          var d =
            "M 0 0 L " + x1 + " " + y1 + " A 1 1 0 " + large + " 1 " + x2 + " " + y2 + " Z";
          var path = document.createElementNS(svgNS, "path");
          path.setAttribute("d", d);
          path.setAttribute("fill", colors[i % colors.length]);
          path.setAttribute("stroke", "#fff");
          path.setAttribute("stroke-width", "0.02");
          svg.appendChild(path);
        }
        for (var j = 0; j < n; j++) {
          var mid = ((j + 0.5) * slice - 90) * (Math.PI / 180);
          var tx = Math.cos(mid) * 0.62;
          var ty = Math.sin(mid) * 0.62;
          var text = document.createElementNS(svgNS, "text");
          text.setAttribute("x", String(tx));
          text.setAttribute("y", String(ty));
          text.setAttribute("text-anchor", "middle");
          text.setAttribute("dominant-baseline", "middle");
          text.setAttribute("fill", "#333");
          text.setAttribute("font-size", n > 20 ? "0.11" : "0.13");
          text.setAttribute("font-weight", "700");
          text.setAttribute("transform", "rotate(" + (j * slice + slice / 2) + " " + tx + " " + ty + ")");
          text.textContent = items[j];
          svg.appendChild(text);
        }
        el.appendChild(svg);
        return { n: n, slice: slice };
      }

      var metaSheng = buildWheel(document.getElementById("wheelSheng"), SHENGMU, colorsSheng);
      var metaYun = buildWheel(document.getElementById("wheelYun"), YUNMU, colorsYun);

      var wheelSheng = document.getElementById("wheelSheng");
      var wheelYun = document.getElementById("wheelYun");
      var outSheng = document.getElementById("outSheng");
      var outYun = document.getElementById("outYun");
      var btnSpin = document.getElementById("btnSpin");

      var rotSheng = 0;
      var rotYun = 0;
      var spinning = false;

      function mod360(x) {
        return ((x % 360) + 360) % 360;
      }

      function easeOutCubic(t) {
        return 1 - Math.pow(1 - t, 3);
      }

      function animateWheel(el, from, to, durationMs, onDone) {
        var start = performance.now();
        function frame(now) {
          var t = Math.min(1, (now - start) / durationMs);
          var e = easeOutCubic(t);
          var current = from + (to - from) * e;
          el.style.transform = "rotate(" + current + "deg)";
          if (t < 1) {
            requestAnimationFrame(frame);
          } else {
            el.style.transform = "rotate(" + to + "deg)";
            if (onDone) onDone();
          }
        }
        requestAnimationFrame(frame);
      }

      function nextRotation(current, idx, n, slice, fullSpins) {
        var endMod = mod360(360 - idx * slice - slice / 2);
        var fromMod = mod360(current);
        var deltaMod = mod360(endMod - fromMod);
        return current + fullSpins * 360 + deltaMod;
      }

      function spin() {
        if (spinning) return;
        spinning = true;
        btnSpin.disabled = true;

        var idxS = Math.floor(Math.random() * metaSheng.n);
        var idxY = Math.floor(Math.random() * metaYun.n);
        var spinsS = 4 + Math.floor(Math.random() * 3);
        var spinsY = 4 + Math.floor(Math.random() * 3);

        var fromS = rotSheng;
        var fromY = rotYun;
        rotSheng = nextRotation(fromS, idxS, metaSheng.n, metaSheng.slice, spinsS);
        rotYun = nextRotation(fromY, idxY, metaYun.n, metaYun.slice, spinsY);

        var dur = 2800 + Math.random() * 400;
        var done = 0;
        function checkDone() {
          done++;
          if (done === 2) {
            outSheng.textContent = SHENGMU[idxS];
            outYun.textContent = YUNMU[idxY];
            spinning = false;
            btnSpin.disabled = false;
          }
        }

        animateWheel(wheelSheng, fromS, rotSheng, dur, checkDone);
        animateWheel(wheelYun, fromY, rotYun, dur + 120, checkDone);
      }

      btnSpin.addEventListener("click", spin);
    })();
